name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-glibc
            os: ubuntu-latest
            arch: x86_64
            static: false
          - name: linux-x86_64-musl
            os: ubuntu-latest
            arch: x86_64
            static: true
            container: '84codes/crystal:latest-alpine'
          - name: linux-aarch64-glibc
            os: ubuntu-24.04-arm
            arch: aarch64
            static: false
          - name: darwin-arm64
            os: macos-15
            arch: arm64
            static: false

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Download source
        uses: actions/checkout@v6

      - name: Install Crystal
        if: matrix.container == null
        uses: crystal-lang/install-crystal@v1

      - name: Install build dependencies (alpine)
        if: matrix.container != null
        run: apk add --no-cache git

      - name: Mark repository as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install shards
        run: shards install

      - name: Build (glibc)
        if: matrix.static == false
        run: shards build --release

      - name: Build (musl static)
        if: matrix.static == true
        run: shards build --release --static

      - name: Rename binary
        run: mv bin/tom bin/tom-${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tom-${{ matrix.name }}
          path: bin/tom-${{ matrix.name }}

  release:
    needs: [ ci, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload binaries and TTF
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
